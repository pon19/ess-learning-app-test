<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しょうがく1ねんせい さんすうWebプリント - ぶんしょうもんだい</title>
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK の読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <!-- ナビゲーションバー -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <a href="index.html" style="text-decoration: none; color: #4a5568; font-weight: bold;">🏠 トップへもどる</a>
            <button id="logoutBtn" style="display:none; background:#cbd5e0; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px;">ログアウト</button>
        </div>

        <!-- ヘッダー -->
        <div class="header">
            <div>
                <span class="title-badge">しょうがく1ねんせい</span>
                <h1>さんすうプリント（1にちめ）</h1>
            </div>
            <div class="name-box" id="userProfileName">
                なまえ：____________________
            </div>
        </div>

        <!-- 1. 計算問題 -->
        <div class="section-title">1. けいさん もんだいを しましょう</div>
        <div class="calc-grid" id="calcGrid"></div>

        <!-- 2. 文章問題（JavaScriptでランダム挿入） -->
        <div class="section-title">2. ぶんしょうもんだい</div>
        <div id="wordProblemArea"></div>

        <!-- 答え合わせボタンと結果エリア -->
        <button class="btn-check" id="checkBtn">こたえあわせをする 💮</button>
        <div class="score-display" id="scoreBox" style="display:none;"></div>
            
        <!-- 成績履歴 -->
        <div class="history-container" style="margin-top: 30px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <h3 style="color: #2b6cb0; margin-top: 0;">📜 いままでの きろく</h3>
            <div id="historyList" style="text-align: left; max-height: 200px; overflow-y: auto; margin-bottom: 15px;"></div>
        </div>

        <button class="btn-reset" id="resetBtn">あたらしい もんだいに する 🔄</button>
    </div>

    <!-- 算数Webプリント専用 JavaScriptファイルの読み込み -->
    <script src="math.js"></script>
</body>
</html>
