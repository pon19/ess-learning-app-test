<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2ねんせい ぶんしょうだいトレーニング</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../common.js" defer></script>
    <script src="practice_word.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- 共通ヘッダー -->
        <div id="globalHeader"></div>

        <div class="back-link-box">
            <a href="menu.html" class="btn-back">⬅️ 2ねんせいメニューへもどる</a>
        </div>

        <div class="header">
            <div>
                <span class="title-badge badge-word-training">ぶんしょうだい</span>
                <h1>ぶんしょうだい トレーニング</h1>
            </div>
        </div>

        <!-- ⚙️ 設定パネル -->
        <div class="settings-panel-word">
            <h3 class="settings-title-word">⚙️ もんだいの 設定（せってい）</h3>
            <div class="settings-grid">
                <div>
                    <label class="setting-label">しゅるい</label>
                    <select id="word-type" class="setting-select">
                        <option value="kuku_word">かけざんの ぶんしょうだい</option>
                        <option value="step2_word">ふたつの しきの けいさん（たしざん・ひきざん）</option>
                        <option value="unit_word">長さ・かさの ぶんしょうだい</option>
                        <option value="mix_word">ぜんぶの しゅるい（ランダム）</option>
                    </select>
                </div>
                <div>
                    <label class="setting-label">もんだいすう</label>
                    <select id="problem-count" class="setting-select">
                        <option value="3">3もん</option>
                        <option value="5" selected>5もん</option>
                        <option value="10">10もん</option>
                    </select>
                </div>
            </div>
            <button id="start-btn" class="btn-generate-word">🔄 この 設定で もんだいを つくる</button>
        </div>

        <!-- 問題表示エリア -->
        <div id="problems-container"></div>

        <!-- 答え合わせボタン・結果表示 -->
        <button id="submit-btn" class="btn-check btn-check-word">こたえあわせをする 💮</button>
        <div id="result-container" class="score-box-result"></div>
    </div>
</body>
</html>
