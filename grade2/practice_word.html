<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2ねんせい ぶんしょうだいトレーニング</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../common.js" defer></script>
    <script src="practice_word.js" defer></script>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <section class="practice-header">
            <h2>2ねんせい ぶんしょうだいトレーニング</h2>
            <p>文章を よくよんで、しきと こたえを かんがえよう！</p>
        </section>

        <!-- 設定フォーム -->
        <section id="setup-section" class="card">
            <h3>れんしゅうの設定</h3>
            
            <div class="form-group">
                <label for="word-type"><strong>もんだいの しゅるい:</strong></label>
                <select id="word-type" class="form-control">
                    <option value="kuku_word">かけざんの ぶんしょうだい</option>
                    <option value="step2_word">ふたつの しきの けいさん（たしざん・ひきざん）</option>
                    <option value="unit_word">長さ・かさの ぶんしょうだい</option>
                    <option value="mix_word">ぜんぶの しゅるい（ランダム）</option>
                </select>
            </div>

            <div class="form-group">
                <label for="problem-count"><strong>もんだいすう:</strong></label>
                <select id="problem-count" class="form-control">
                    <option value="3">3もん</option>
                    <option value="5" selected>5もん</option>
                    <option value="10">10もん</option>
                </select>
            </div>

            <button id="start-btn" class="btn btn-primary btn-large">れんしゅうを はじめる！</button>
        </section>

        <!-- 問題表示エリア -->
        <section id="quiz-section" class="card hidden">
            <div class="quiz-header">
                <span id="progress-text">もんだい</span>
                <button id="reset-btn" class="btn btn-small btn-secondary">やりなおす</button>
            </div>

            <form id="quiz-form">
                <div id="problems-container" class="problems-list"></div>
                <button type="submit" id="submit-btn" class="btn btn-success btn-large">こたえあわせ</button>
            </form>

            <div id="result-container" class="result-box hidden">
                <h3 id="result-score"></h3>
                <p id="result-message"></p>
                <button id="retry-btn" class="btn btn-primary">もう一度ちょうせん</button>
            </div>
        </section>

        <div class="navigation-bottom">
            <a href="menu.html" class="btn btn-secondary">← 2ねんせいメニューへもどる</a>
        </div>
    </main>

    <div id="footer-placeholder"></div>
</body>
</html>
