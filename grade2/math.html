<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2ねんせい きょうのチャレンジ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
    
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../common.js" defer></script>
    <script src="math.js" defer></script>
</head>
<body>
    <div class="container">
        <div id="globalHeader"></div>
        
        <!-- ナビゲーションバー -->
        <div class="nav-bar">
            <a href="menu_math.html" class="btn-back">⬅️ メニューへもどる</a>
        </div>

        <!-- ヘッダー -->
        <div class="header">
            <div>
                <span class="title-badge badge-challenge">きょうのチャレンジ</span>
                <h1>🏆 2ねんせい きょうの チャレンジ</h1>
            </div>
        </div>

        <!-- ⏱️ タイマー表示エリア -->
        <div id="timer-display" class="timer-box hidden">
            <span>⏱️ のこりじかん:</span>
            <span id="timer-seconds" class="timer-seconds">60</span>
            <span>びょう</span>
        </div>

        <!-- ローディングメッセージ -->
        <div id="loading-msg" class="loading">問題をよみこんでいます...</div>

        <!-- 問題表示フォーム -->
        <form id="challenge-form" class="hidden">
            <div class="section-title">けいさん もんだいを しましょう</div>
            <div id="problems-container" class="calc-grid"></div>

            <button type="submit" id="submit-btn" class="btn-check btn-check-challenge">こたえあわせをして きろくする！ 💮</button>
        </form>

        <!-- 結果表示エリア -->
        <div id="result-container" class="score-box-result hidden">
            <h3 id="result-score"></h3>
            <p id="result-time" style="font-weight: bold; margin: 0.5rem 0;"></p>
            <p id="result-message"></p>
            <div style="margin-top: 1.5rem;">
                <a href="menu_math.html" class="btn-back">メニューへもどる</a>
            </div>
        </div>

        <!-- 成績履歴 -->
        <div class="history-card">
            <h3 class="history-title">📜 いままでの きろく</h3>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>
</body>
</html>
