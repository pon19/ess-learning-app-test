<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2ねんせい きょうの チャレンジプリント</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../common.js" defer></script>
    <script src="math.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- 共通ヘッダー -->
        <div id="globalHeader"></div>

        <div class="back-link-box">
            <a href="menu.html" class="btn-back">⬅️ 2ねんせいメニューへもどる</a>
        </div>

        <div class="header">
            <div>
                <span class="title-badge badge-challenge">きょうのチャレンジ</span>
                <h1>🏆 2ねんせい きょうの チャレンジ</h1>
            </div>
        </div>

        <!-- ⏱️ タイマー表示エリア -->
        <div id="timer-display" class="timer-box hidden">
            <span>⏱️ のこりじかん:</span>
            <span id="timer-seconds" class="timer-seconds">60</span>
            <span>びょう</span>
        </div>

        <!-- 問題表示エリア -->
        <div id="loading-msg" class="loading">問題をよみこんでいます...</div>

        <form id="challenge-form" class="hidden">
            <div id="problems-container" class="calc-grid"></div>
            <button type="submit" id="submit-btn" class="btn-check btn-check-challenge">こたえあわせをして きろくする！ 💮</button>
        </form>

        <!-- 結果表示エリア -->
        <div id="result-container" class="score-box-result hidden">
            <h3 id="result-score"></h3>
            <p id="result-time" style="font-weight: bold; margin: 0.5rem 0;"></p>
            <p id="result-message"></p>
            <div style="margin-top: 1.5rem;">
                <a href="menu.html" class="btn-generate">メニューへもどる</a>
            </div>
        </div>
    </div>
</body>
</html>
