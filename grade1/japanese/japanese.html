<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しょうがく1ねんせい こくごWebプリント</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
    
    <link rel="stylesheet" href="../../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../common.js"></script>
    <script src="japanese.js" defer></script>
</head>
<body>
    <div class="container">
        <div id="globalHeader"></div>
        
        <!-- ナビゲーションバー -->
        <div class="nav-bar">
            <a href="menu.html" class="btn-back">⬅️ メニューへもどる</a>
        </div>

        <!-- ヘッダー -->
        <div class="header">
            <div>
                <span class="title-badge badge-grade-1">しょうがく1ねんせい</span>
                <h1>こくごプリント</h1>
            </div>
        </div>

        <!-- 1. くっつきの「は・を・へ」 (5問) -->
        <div class="section-title">1. （ ）に はいる ことばを えらぼう (5もん)</div>
        <div id="particleArea" class="word-card-container"></div>

        <!-- 2. かんじの よみ・かき (5問) -->
        <div class="section-title">2. かんじの よみかたを かこう (5もん)</div>
        <div id="kanjiArea" class="word-card-container"></div>

        <!-- 答え合わせボタンと結果エリア -->
        <button class="btn-check" id="checkBtn">こたえあわせをする 💮</button>
        <div class="score-box-result" id="scoreBox" style="display: none;"></div>
            
        <!-- 成績履歴 -->
        <div class="history-card">
            <h3 class="history-title">📜 いままでの きろく</h3>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>
</body>
</html>
