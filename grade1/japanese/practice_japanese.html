<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しょうがく1ねんせい こくごトレーニング</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
    
    <link rel="stylesheet" href="../../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../common.js"></script>
    <script src="practice_japanese.js" defer></script>
</head>
<body>
    <div class="container">
        <div id="globalHeader"></div>

        <div class="nav-bar">
            <a href="menu_japanese.html" class="btn-back">⬅️ メニューへもどる</a>
        </div>

        <div class="header">
            <div>
                <span class="title-badge badge-grade-1">1ねんせい</span>
                <h1>こくご トレーニング</h1>
            </div>
        </div>

        <!-- 設定パネル -->
        <div class="settings-panel-jp">
            <div class="settings-row">
                <label class="setting-label-bold">
                    しゅるい：
                    <select id="settingType" class="setting-select-inline">
                        <option value="all">ぜんぶ</option>
                        <option value="particle">は・を・へ</option>
                        <option value="kanji">かんじの よみ</option>
                        <option value="katakana">カタカナの かきかえ</option>
                        <option value="opposite">はんたいの ことば</option>
                    </select>
                </label>

                <label class="setting-label-bold">
                    もんすう：
                    <select id="settingCount" class="setting-select-inline">
                        <option value="5">5もん</option>
                        <option value="10" selected>10もん</option>
                    </select>
                </label>

                <button id="generateBtn" class="btn-secondary btn-generate-jp">
                    🔄 この せっていで さくせい
                </button>
            </div>
        </div>

        <!-- 問題描画エリア -->
        <div id="japaneseProblemArea" class="word-card-container"></div>

        <!-- 答え合わせボタンと結果エリア -->
        <button class="btn-check mt-20" id="checkBtn">こたえあわせをする 💮</button>
        <div class="score-box-result display-none" id="scoreBox"></div>
    </div>
</body>
</html>
