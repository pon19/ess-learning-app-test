<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>けいさん トレーニング - しょうがく1ねんせい</title>
    <link rel="stylesheet" href="../../style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../common.js"></script>
    <script src="practice_math.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- 共通ヘッダー -->
        <div id="globalHeader"></div>

        <div class="back-link-box">
            <a href="menu_math.html" class="btn-back">⬅️ メニューへもどる</a>
        </div>

        <div class="header">
            <div>
                <span class="title-badge badge-training">トレーニング</span>
                <h1>けいさん れんしゅう</h1>
            </div>
        </div>

        <!-- ⚙️ 設定パネル -->
        <div class="settings-panel">
            <h3 class="settings-title">⚙️ もんだいの 設定（せってい）</h3>

            <div class="settings-grid">
                <!-- 単元選択（複数選択可能） -->
                <div style="grid-column: 1 / -1;">
                    <label class="setting-label">学習した たんげん（複数えらべます）</label>
                    <div class="unit-checkbox-group" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px;">
                        <label><input type="checkbox" name="unit" value="basic_add" checked> 10までの たしざん</label>
                        <label><input type="checkbox" name="unit" value="basic_sub" checked> 10までの ひきざん</label>
                        <label><input type="checkbox" name="unit" value="advanced_add"> くりあがりの ある たしざん</label>
                        <label><input type="checkbox" name="unit" value="advanced_sub"> くりさがりが ある ひきざん</label>
                        <label><input type="checkbox" name="unit" value="three_nums"> 3つの かずの けいさん</label>
                        <label><input type="checkbox" name="unit" value="large_nums"> おおきい かず（100まで）</label>
                    </div>
                </div>

                <!-- 問題数 -->
                <div>
                    <label class="setting-label">もんだいすう</label>
                    <select id="settingCount" class="setting-select">
                        <option value="5">5もん</option>
                        <option value="10" selected>10もん</option>
                        <option value="15">15もん</option>
                    </select>
                </div>
            </div>

            <button id="generateBtn" class="btn-generate">
                🔄 この 設定で もんだいを つくる
            </button>
        </div>

        <!-- 計算問題グリッド -->
        <div class="calc-grid" id="calcGrid"></div>

        <!-- 答え合わせボタン・結果エリア -->
        <button class="btn-check btn-check-training" id="checkBtn">こたえあわせをする 💮</button>
        <div class="score-box-result" id="scoreBox"></div>
    </div>
</body>
</html>
