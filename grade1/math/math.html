<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>しょうがく1ねんせい さんすうWebプリント</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
    
    <link rel="stylesheet" href="../../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../common.js"></script>
    <script src="math.js"></script>
</head>
<body>
    <div class="container">
        <div id="globalHeader"></div>
        <!-- ナビゲーションバー -->
        <div class="nav-bar">
            <a href="menu.html" class="btn-back">⬅️ メニューへもどる</a>
        </div>

        <!-- ヘッダー -->
        <div class="header">
            <div>
                <span class="title-badge">しょうがく1ねんせい</span>
                <h1>さんすうプリント</h1>
            </div>
        </div>

        <!-- 1. 計算問題 (10問) -->
        <div class="section-title">1. けいさん もんだいを しましょう (10もん)</div>
        <div class="calc-grid" id="calcGrid"></div>

        <!-- 2. 文章問題 (5問) -->
        <div class="section-title">2. ぶんしょう もんだいを しましょう (5もん)</div>
        <div id="wordProblemArea"></div>

        <!-- 答え合わせボタンと結果エリア -->
        <button class="btn-check" id="checkBtn">こたえあわせをする 💮</button>
        <div class="score-box-result" id="scoreBox"></div>
            
        <!-- 成績履歴 -->
        <div class="history-card">
            <h3 class="history-title">📜 いままでの きろく</h3>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>
</body>
</html>
