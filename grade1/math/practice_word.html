<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ぶんしょうだい トレーニング - しょうがく1ねんせい</title>
    <link rel="stylesheet" href="../../style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../common.js"></script>
    <script src="practice_word.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- 共通ヘッダー -->
        <div id="globalHeader"></div>

        <div class="back-link-box">
            <a href="menu_math.html" class="btn-back">⬅️ メニューへもどる</a>
        </div>

        <div class="header">
            <div>
                <span class="title-badge badge-word-training">トレーニング</span>
                <h1>ぶんしょうだい れんしゅう</h1>
            </div>
        </div>

        <!-- ⚙️ 設定パネル -->
        <div class="settings-panel-word">
            <h3 class="settings-title-word">⚙️ もんだいの 設定（せってい）</h3>
            
            <div class="settings-grid">
                <!-- 習った単元の選択 -->
                <div style="grid-column: 1 / -1;">
                    <div class="unit-header-box">
                        <label class="setting-label">ならった たんげん（えらんでね）</label>
                        <div class="btn-unit-action-group">
                            <button type="button" id="selectAllBtn" class="action-btn">✅ ぜんぶ えらぶ</button>
                            <button type="button" id="deselectAllBtn" class="action-btn">⬜ ぜんぶ はずす</button>
                        </div>
                    </div>

                    <div class="unit-checkbox-group">
                        <label class="unit-card"><input type="checkbox" name="unit" value="basic_add" checked> 10までの たしざん</label>
                        <label class="unit-card"><input type="checkbox" name="unit" value="basic_sub" checked> 10までの ひきざん</label>
                        <label class="unit-card"><input type="checkbox" name="unit" value="advanced_add"> くりあがりの ある たしざん</label>
                        <label class="unit-card"><input type="checkbox" name="unit" value="advanced_sub"> くりさがりが ある ひきざん</label>
                        <label class="unit-card"><input type="checkbox" name="unit" value="three_nums"> 3つの かずの けいさん</label>
                        <label class="unit-card"><input type="checkbox" name="unit" value="compare"> ちがいを くらべる（ひきざん）</label>
                    </div>
                </div>

                <!-- 問題数 -->
                <div>
                    <label class="setting-label">もんだいすう</label>
                    <select id="settingCount" class="setting-select">
                        <option value="3">3もん</option>
                        <option value="5" selected>5もん</option>
                        <option value="10">10もん</option>
                    </select>
                </div>
            </div>

            <button id="generateBtn" class="btn-generate-word">
                🔄 この 設定で もんだいを つくる
            </button>
        </div>

        <!-- 文章問題表示エリア -->
        <div id="wordProblemArea"></div>

        <!-- 答え合わせボタン・結果エリア -->
        <button class="btn-check btn-check-word" id="checkBtn">こたえあわせをする 💮</button>
        <div class="score-box-result" id="scoreBox"></div>
    </div>
</body>
</html>
