<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3年生 計算トレーニング</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../common.js" defer></script>
    <script src="practice_math.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- 共通ヘッダー -->
        <div id="globalHeader"></div>

        <div class="back-link-box">
            <a href="menu_math.html" class="btn-back">⬅️ 3年生メニューへもどる</a>
        </div>

        <div class="header">
            <div>
                <span class="title-badge badge-training">計算</span>
                <h1>計算 トレーニング</h1>
            </div>
        </div>

        <!-- ⚙️ 設定フォーム -->
        <section id="setup-section" class="settings-panel">
            <h3 class="settings-title">⚙️ 問題の設定</h3>
            
            <div class="settings-grid">
                <div>
                    <label for="calc-type" class="setting-label">種類</label>
                    <select id="calc-type" class="setting-select">
                        <option value="div_no_rem">割り算（あまりなし）</option>
                        <option value="div_rem">割り算（あまりあり）</option>
                        <option value="mul_2digit">かけ算の筆算（2桁×1桁）</option>
                        <option value="add_sub_3digit">3桁の足し算・引き算</option>
                        <option value="decimal_add_sub">小数の足し算・引き算</option>
                        <option value="mix_3rd">すべての計算（ランダム）</option>
                    </select>
                </div>

                <div>
                    <label for="problem-count" class="setting-label">問題数</label>
                    <select id="problem-count" class="setting-select">
                        <option value="5">5問</option>
                        <option value="10" selected>10問</option>
                        <option value="15">15問</option>
                        <option value="20">20問</option>
                    </select>
                </div>
            </div>

            <button id="start-btn" class="btn-generate">🔄 練習をはじめる！</button>
        </section>

        <!-- 問題表示エリア -->
        <section id="quiz-section" class="hidden">
            <div class="quiz-header-bar">
                <span id="progress-text">問題一覧</span>
                <button id="reset-btn" class="btn-back">やり直す</button>
            </div>

            <form id="quiz-form">
                <div id="problems-container" class="calc-grid"></div>
                <button type="submit" id="submit-btn" class="btn-check btn-check-training">答え合わせをする 💮</button>
            </form>

            <div id="result-container" class="score-box-result hidden">
                <h3 id="result-score"></h3>
                <p id="result-message"></p>
                <button id="retry-btn" class="btn-generate btn-retry">もう一度挑戦</button>
            </div>
        </section>
    </div>
</body>
</html>
