<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3年生 今日のチャレンジ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
    
    <link rel="stylesheet" href="../../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../common.js" defer></script>
    <script src="math.js" defer></script>
</head>
<body>
    <div class="container">
        <div id="globalHeader"></div>
        
        <!-- ナビゲーションバー -->
        <div class="nav-bar">
            <a href="menu_math.html" class="btn-back">⬅️ メニューへもどる</a>
        </div>

        <!-- ヘッダー -->
        <div class="header">
            <div>
                <span class="title-badge badge-challenge">今日のチャレンジ</span>
                <h1>🏆 3年生 今日の チャレンジ</h1>
            </div>
        </div>

        <!-- ⏱️ タイマー表示エリア -->
        <div id="timer-display" class="timer-box hidden">
            <span>⏱️ のこり時間:</span>
            <span id="timer-seconds" class="timer-seconds">60</span>
            <span>秒</span>
        </div>

        <!-- ローディングメッセージ -->
        <div id="loading-msg" class="loading">問題を読み込んでいます...</div>

        <!-- 問題表示フォーム -->
        <form id="challenge-form" class="hidden">
            <div class="section-title">計算問題を解きましょう</div>
            <div id="problems-container" class="calc-grid"></div>

            <button type="submit" id="submit-btn" class="btn-check btn-check-challenge">答え合わせをして 記録する！ 💮</button>
        </form>

        <!-- 結果表示エリア -->
        <div id="result-container" class="score-box-result hidden">
            <h3 id="result-score"></h3>
            <p id="result-time" class="result-time-text"></p>
            <p id="result-message"></p>
            <div class="result-action-box">
                <a href="menu_math.html" class="btn-back">メニューへもどる</a>
            </div>
        </div>

        <!-- 成績履歴 -->
        <div class="history-card">
            <h3 class="history-title">📜 いままでの 記録</h3>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>
</body>
</html>
