<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - しょうがくせい Webプリント</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK & 共通JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="common.js"></script>
    <script src="mypage.js"></script>
</head>
<body>
    <div class="container mypage-container">
        <h1 class="mypage-title">👤 マイページ</h1>

        <!-- プロフィール確認・変更エリア -->
        <div class="mypage-card">
            
            <!-- 変更不可の情報（確認用） -->
            <div class="mypage-readonly-box">
                <p class="mypage-readonly-item"><strong>お名前（変更不可）:</strong> <span id="displayNameView">-</span></p>
                <p class="mypage-readonly-item"><strong>携帯番号（変更不可）:</strong> <span id="phoneView">-</span></p>
                <!-- 👇 ★ここに追加：現在の学年（表示専用） -->
                <p class="mypage-readonly-item">
                    <strong>現在の学年（自動進級）:</strong> <span id="gradeView" class="mypage-grade-highlight">-</span>
                </p>
                <small class="mypage-note-text">※お名前・電話番号の変更はお問い合わせよりご連絡ください。</small>
            </div>

            <hr class="mypage-divider">

            <!-- 変更可能な項目フォーム -->
            <form id="updateProfileForm">
                <h3 class="mypage-form-title">✏️ プロフィール変更</h3>
                
                <!-- ニックネーム -->
                <div class="mypage-field-group">
                    <label class="mypage-label">ニックネーム</label>
                    <input type="text" id="mypageNickname" required class="mypage-input">
                </div>

                <!-- メールアドレス -->
                <div class="mypage-field-group">
                    <label class="mypage-label">メールアドレス</label>
                    <input type="email" id="mypageEmail" required class="mypage-input">
                </div>

                <!-- 新しいパスワード -->
                <div class="mypage-field-group mb-20">
                    <label class="mypage-label">新しいパスワード <span class="mypage-sublabel">(変更する場合のみ入力)</span></label>
                    <input type="password" id="mypagePassword" placeholder="6文字以上" minlength="6" class="mypage-input">
                </div>

                <button type="submit" id="saveBtn" class="mypage-submit-btn">変更を保存する</button>
            </form>

            <p id="mypageMsg" class="mypage-msg"></p>
        </div>

        <!-- 元のページにもどるボタン -->
        <div class="mypage-back-box">
            <button id="backBtn" class="mypage-back-btn">
                ← まえの ページに もどる
            </button>
        </div>
    </div>
</body>
</html>
